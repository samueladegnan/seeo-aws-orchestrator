<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <title>{{ page.title | default: site.title }}</title>
    {% include head-custom.html %}
  </head>

  <body>
    <a id="skip-to-content" href="#content">Skip to content</a>

    <header class="page-header" role="banner">
      {% include nav.html %}
      <h1 class="project-name">{{ page.title | default: site.title }}</h1>
      <h2 class="project-tagline">{{ page.description | default: site.description }}</h2>
    </header>

    <main id="content" class="main-content" role="main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p class="site-footer__tagline">Built with Python, FastAPI, Terraform & AWS.</p>
        <p class="site-footer__links">
          <a href="https://samueladegnan.github.io/">Portfolio</a>
          <span aria-hidden="true">&bull;</span>
          <a href="{{ site.github.repository_url }}">GitHub</a>
          <span aria-hidden="true">&bull;</span>
          <a href="{{ site.baseurl }}/">Home</a>
        </p>
        <p class="site-footer__copyright">
          &copy; 2026 <a href="https://samueladegnan.github.io/">Samuel Degnan</a>
        </p>
      </div>
    </footer>
  </body>
</html>
