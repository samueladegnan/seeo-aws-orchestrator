<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <title>{{ page.title | default: site.title | escape }}</title>
    {% include head-custom.html %}
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    {% include nav.html %}

    <main id="main-content" class="main-content" role="main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p class="site-footer__tagline">Built with Ruby on Rails and Terraform across a multi-cloud foundation.</p>
        <p class="site-footer__copyright">
          &copy; {{ site.time | date: '%Y' }} <a href="{{ site.baseurl }}/">Sam Degnan</a>
        </p>
      </div>
    </footer>
  </body>
</html>
