<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <title>{{ page.title | default: site.title | escape }}</title>
    {% include head-custom.html %}
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    {% include nav.html %}

    <main id="main-content" class="main-content{% if page.security_report %} security-report-content{% endif %}" role="main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p class="site-footer__tagline">A provider-neutral control plane for short-lived multi-cloud environments.</p>
        <p class="site-footer__copyright">
          &copy; 2026 <a href="https://samueladegnan.github.io/">Samuel Degnan</a>
        </p>
      </div>
    </footer>
  </body>
</html>
