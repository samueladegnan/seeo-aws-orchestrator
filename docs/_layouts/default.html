<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <title>{{ page.title | default: site.title }}</title>
    {% include head-custom.html %}
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    {% include nav.html %}

    <header class="page-header" role="banner">
      <h1 class="project-name">{{ site.title }}</h1>
      <p class="project-tagline">{{ page.description | default: site.description }}</p>
      <a class="btn" href="{{ site.baseurl }}/demo/">View Live Demo</a>
    </header>

    <main id="main-content" class="main-content" role="main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p class="site-footer__tagline">Built with Ruby on Rails, Terraform & AWS.</p>
        <p class="site-footer__copyright">&copy; {{ site.time | date: '%Y' }} <a href="https://samueladegnan.github.io/">Sam Degnan</a></p>
      </div>
    </footer>
  </body>
</html>
