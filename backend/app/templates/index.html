<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEEO Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>SEEO</h1>
            <p>Secure Ephemeral Environment Orchestrator</p>
        </div>
    </header>

    <main class="container">
        <section class="card form-card">
            <h2>Request Environment</h2>
            <form id="request-form">
                <div class="field">
                    <label for="project-name">Project Name</label>
                    <input type="text" id="project-name" name="project_name" placeholder="e.g. my-api" required>
                </div>
                <div class="field">
                    <label for="ttl">TTL (minutes)</label>
                    <input type="number" id="ttl" name="ttl_minutes" min="15" max="1440" value="60" required>
                </div>
                <div class="field">
                    <label for="api-key">API Key</label>
                    <input type="password" id="api-key" name="api_key" placeholder="X-API-Key" required>
                </div>
                <button type="submit" class="btn btn-primary">Provision Environment</button>
            </form>
            <div id="message" class="message hidden"></div>
        </section>

        <section class="card">
            <div class="table-header">
                <h2>Active Environments</h2>
                <button id="refresh-btn" class="btn btn-secondary">Refresh</button>
            </div>
            <div class="table-wrap">
                <table id="environments-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Project</th>
                            <th>Status</th>
                            <th>Public IP</th>
                            <th>Expires</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="empty-row">
                            <td colspan="6">Click Refresh to load environments.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 SEEO. Built for secure ephemeral cloud environments.</p>
        </div>
    </footer>

    <script src="/static/app.js"></script>
</body>
</html>
