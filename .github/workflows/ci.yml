name: SEEO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1 (master)
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: backend

      - name: Set up database
        env:
          RAILS_ENV: test
        run: bundle exec rails db:create db:migrate

      - name: Run RuboCop
        run: bundle exec rubocop

      - name: Run RSpec with coverage
        run: bundle exec rspec

      - name: Validate provider response fixtures
        run: ruby -rjson -e 'Dir["spec/fixtures/provider_responses/*.json"].each { |path| JSON.parse(File.read(path)) }'


      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: backend/coverage/

  provider-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build provider runner image
        working-directory: backend
        run: docker build --file Dockerfile.runner --tag seeo-provider-runner:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --omit=optional

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack:
          - infrastructure
          - infrastructure/stacks/azure
          - infrastructure/stacks/gcp
          - infrastructure/stacks/oci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.5.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ${{ matrix.stack }}

      - name: Terraform Init
        run: terraform init -input=false
        working-directory: ${{ matrix.stack }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ matrix.stack }}

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@9b70310bcd306d11740313070b940167d6b23085 # v12
        with:
          directory: ${{ matrix.stack }}
          framework: terraform
          quiet: true
          soft_fail: false
