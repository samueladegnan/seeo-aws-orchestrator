name: SEEO AI Guardrail

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardrail:
    name: Static analysis + AI guardrail triage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SEEO
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1 (master)
        with:
          ruby-version: "3.3"

      - name: Install Brakeman
        run: gem install brakeman --no-document

      - name: Run Brakeman and generate SARIF
        # Guardrail owns triage and disposition. Brakeman must still emit SARIF
        # when it reports warnings so the next step can review them.
        run: brakeman --format sarif --no-exit-on-warn --output seeo-brakeman.sarif backend

      - name: Filter reviewed Brakeman suppressions
        # Keep the complete scan as an artifact, but do not send explicitly
        # suppressed maintenance findings to the blocking triage step.
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path("seeo-brakeman.sarif")
          target = Path("seeo-brakeman-active.sarif")
          report = json.loads(source.read_text(encoding="utf-8"))
          removed = 0

          for run in report.get("runs", []):
              active_results = []
              for result in run.get("results", []):
                  suppressions = result.get("suppressions", [])
                  if any(item.get("kind") == "external" for item in suppressions):
                      removed += 1
                  else:
                      active_results.append(result)
              run["results"] = active_results

          target.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(f"Filtered {removed} reviewed Brakeman suppression(s)")
          PY

      - name: Build Guardrail v1.1.0
        run: docker build --tag seeo-guardrail:v1.1.0 https://github.com/samueladegnan/ai-cicd-security-guardrail.git#5b99076055895ffcfe9c2a3e4325524fba8cdb9f

      - name: Run AI Guardrail triage
        env:
          GUARDRAIL_PROVIDER: ${{ secrets.GUARDRAIL_LLM_PROVIDER || 'mock' }}
          GUARDRAIL_API_KEY: ${{ secrets.GUARDRAIL_LLM_API_KEY }}
          GUARDRAIL_MODEL: ${{ secrets.GUARDRAIL_LLM_MODEL }}
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --env "GUARDRAIL_LLM_PROVIDER=${GUARDRAIL_PROVIDER}" \
            --env "GUARDRAIL_LLM_API_KEY=${GUARDRAIL_API_KEY}" \
            --env "GUARDRAIL_LLM_MODEL=${GUARDRAIL_MODEL}" \
            --env GUARDRAIL_FAIL_ON_UNCLEAR=false \
            seeo-guardrail:v1.1.0 \
            /workspace/seeo-brakeman-active.sarif \
            --repo-root /workspace \
            --provider "${GUARDRAIL_PROVIDER}" \
            --max-concurrency 3 \
            --format sarif \
            --language auto \
            --no-fail-on-unclear \
            --output-json /workspace/guardrail-report.json \
            --output-markdown /workspace/guardrail-report.md

      - name: Upload guardrail reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: guardrail-reports
          path: |
            guardrail-report.md
            guardrail-report.json
            seeo-brakeman.sarif
            seeo-brakeman-active.sarif
